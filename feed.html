<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feed — AnimeSe</title>
  <meta name="description" content="Acompanhe os animes da temporada, busque qualquer anime e monte sua lista: assistindo, já assisti, pretendo assistir e dropei.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='16' fill='%23e2457a'/><text x='16' y='22' font-size='17' text-anchor='middle' fill='white'>ア</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pagina-feed">
  <header id="site-header"></header>
  <main>
    <div class="feed-barra" id="feed-barra"></div>
    <section class="feed" id="feed" aria-label="Feed de vídeos" tabindex="-1">
      <div class="feed-carregando">Carregando o feed…</div>
    </section>
    <dialog class="dialogo" id="dialogo-publicar" aria-labelledby="titulo-publicar">
      <form method="dialog" id="form-publicar" novalidate>
        <h2 id="titulo-publicar">Publicar vídeo no feed</h2>
        <div class="campo">
          <label for="pub-link">Link do vídeo</label>
          <input id="pub-link" type="url" inputmode="url" placeholder="Cole o link do YouTube, TikTok ou Instagram" required>
          <p class="ajuda">No TikTok, use o link completo do vídeo (com <code>/video/</code> e números).</p>
          <p class="erro" id="pub-erro" hidden></p>
        </div>
        <div class="pub-previa" id="pub-previa" hidden></div>
        <div class="campo">
          <label for="pub-legenda">Legenda <span class="opcional">(opcional)</span></label>
          <textarea id="pub-legenda" maxlength="300" rows="2" placeholder="Sobre o que é o vídeo?"></textarea>
        </div>
        <div class="acoes-form">
          <button class="btn btn-primario" type="submit" id="pub-enviar">Publicar</button>
          <button class="btn btn-contorno" type="button" id="pub-cancelar">Cancelar</button>
        </div>
      </form>
    </dialog>
    <dialog class="dialogo" id="dialogo-denuncia" aria-labelledby="titulo-denuncia">
      <form method="dialog" id="form-denuncia" novalidate>
        <h2 id="titulo-denuncia">Denunciar publicação</h2>
        <p class="secao-descricao">A denúncia é anônima para quem publicou. O admin do AnimeSe analisa todas.</p>
        <fieldset class="motivos-denuncia" id="motivos-denuncia"><legend class="sr-only">Motivo</legend></fieldset>
        <div class="campo">
          <label for="den-detalhe">Detalhes <span class="opcional">(opcional)</span></label>
          <textarea id="den-detalhe" maxlength="300" rows="2"></textarea>
        </div>
        <div class="acoes-form">
          <button class="btn btn-primario" type="submit" id="den-enviar">Enviar denúncia</button>
          <button class="btn btn-contorno" type="button" id="den-cancelar">Cancelar</button>
        </div>
      </form>
    </dialog>
  </main>
  <footer id="site-footer"></footer>
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script type="module" src="js/paginas/feed.js"></script>
</body>
</html>
