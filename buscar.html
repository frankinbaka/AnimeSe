<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buscar anime — AnimeSe</title>
  <meta name="description" content="Acompanhe os animes da temporada, busque qualquer anime e monte sua lista: assistindo, já assisti, pretendo assistir e dropei.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='16' fill='%23e2457a'/><text x='16' y='22' font-size='17' text-anchor='middle' fill='white'>ア</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main>
    <section class="container">
      <h1 id="titulo-busca">Buscar anime</h1>
      <form class="busca-grande" id="form-busca" role="search">
        <label class="sr-only" for="campo-busca">Nome do anime</label>
        <input id="campo-busca" name="q" type="search" placeholder="Ex.: Sword Art Online, Frieren, One Piece" autocomplete="off">
        <button class="btn btn-primario" type="submit">Buscar</button>
      </form>
      <div id="resultado-info" aria-live="polite"></div>
      <div class="grade" id="grade-resultados"></div>
      <div class="paginacao" id="paginacao"></div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script type="module" src="js/paginas/buscar.js"></script>
</body>
</html>
